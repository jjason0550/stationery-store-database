<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文具店商品與訂單管理</title>
<style>
body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f3f6fb;color:#203040;margin:0}header{background:#233e66;color:white;padding:28px max(18px,calc((100% - 1000px)/2))}main{max-width:1000px;margin:24px auto;padding:0 16px}.card{background:white;padding:22px;border-radius:14px;margin:16px 0;box-shadow:0 3px 14px #20304012}h2{color:#294e7a}label{display:flex;flex-direction:column;gap:5px;font-weight:600}input,select{padding:10px;border:1px solid #b8c7d9;border-radius:8px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}button{background:#285b92;color:white;border:0;border-radius:8px;padding:10px 15px;margin:10px 6px 6px 0;cursor:pointer}.danger{background:#a83a3a}.hint{color:#536779}.ok{color:#167044}.err{color:#a12a2a}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border:1px solid #d9e2ec;padding:8px;text-align:left}th{background:#edf3f9}.scroll{overflow:auto}
</style></head><body><header><h1>商品與訂單管理</h1><p>新增商品、建立訂單、查詢訂單明細及取消訂單。</p></header><main>
<section class="card"><h2>新增商品項目</h2><div class="grid">
<label>商品名稱<input id="pname" placeholder="例如：黑色原子筆"></label>
<label>分類<select id="pcat"><option value="C01">螢光筆</option><option value="C02">鉛筆</option><option value="C03">原子筆</option><option value="C04">筆記用品</option><option value="C05">文具用品</option></select></label>
<label>單價<input id="price" type="number" min="0.01" step="0.01"></label>
<label>初始庫存<input id="stock" type="number" min="0" value="10"></label>
<label>安全庫存<input id="minstock" type="number" min="0" value="5"></label></div><button id="addp">新增商品</button><span id="pmsg"></span><div id="products"></div></section>
<section class="card"><h2>建立訂單</h2><div class="grid">
<label>會員<select id="member"></select></label><label>商品<select id="product"></select></label><label>數量<input id="qty" type="number" min="1" value="1"></label></div>
<button id="addline">加入訂單項目</button><div id="cart"></div><p><b>總金額：$<span id="total">0</span></b></p><button id="checkout">送出訂單</button><span id="omsg"></span></section>
<section class="card"><h2>訂單紀錄與管理</h2><div id="orders"></div><div id="detail"></div></section>
<p><a href="index.html">← 回到資料庫教學首頁</a></p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script><script>
let db,cart=[];
const schema=`
CREATE TABLE MEMBERS(MemberID TEXT PRIMARY KEY,Name TEXT NOT NULL,Phone TEXT,Points INTEGER DEFAULT 0,JoinDate TEXT);
CREATE TABLE CATEGORIES(CategoryID TEXT PRIMARY KEY,CategoryName TEXT NOT NULL UNIQUE);
CREATE TABLE PRODUCTS(ProductID TEXT PRIMARY KEY,ProductName TEXT NOT NULL,CategoryID TEXT,Price REAL NOT NULL,StockQuantity INTEGER NOT NULL,MinStock INTEGER NOT NULL,FOREIGN KEY(CategoryID) REFERENCES CATEGORIES(CategoryID));
CREATE TABLE ORDERS(OrderID TEXT PRIMARY KEY,MemberID TEXT,OrderDate TEXT,TotalAmount REAL,FOREIGN KEY(MemberID) REFERENCES MEMBERS(MemberID));
CREATE TABLE ORDER_DETAILS(DetailID TEXT PRIMARY KEY,OrderID TEXT,ProductID TEXT,Quantity INTEGER,UnitPrice REAL,FOREIGN KEY(OrderID) REFERENCES ORDERS(OrderID),FOREIGN KEY(ProductID) REFERENCES PRODUCTS(ProductID));
CREATE TABLE INVENTORY_LOG(LogID TEXT PRIMARY KEY,ProductID TEXT,ChangeType TEXT,ChangeQuantity INTEGER,ChangeDate TEXT,FOREIGN KEY(ProductID) REFERENCES PRODUCTS(ProductID));
INSERT INTO CATEGORIES VALUES('C01','螢光筆'),('C02','鉛筆'),('C03','原子筆'),('C04','筆記用品'),('C05','文具用品');
INSERT INTO PRODUCTS VALUES('P001','黃色螢光筆','C01',25,50,10),('P002','粉紅色螢光筆','C01',25,30,10),('P003','2B鉛筆','C02',12,100,20),('P004','自動鉛筆','C02',45,20,25),('P005','藍色原子筆','C03',15,80,20),('P006','按壓式原子筆','C03',30,15,20),('P007','筆記本','C04',50,40,10),('P008','橡皮擦','C05',10,8,10);
INSERT INTO MEMBERS VALUES('M001','王小明','0912000001',120,'2026-01-10'),('M002','陳小美','0912000002',60,'2026-02-15'),('M003','林同學','0912000003',20,'2026-03-01');
INSERT INTO ORDERS VALUES('O001','M001','2026-10-01',80),('O002','M002','2026-10-03',90),('O003','M001','2026-10-10',75),('O004','M003','2026-10-12',60);
INSERT INTO ORDER_DETAILS VALUES('D001','O001','P001',2,25),('D002','O001','P005',2,15),('D003','O002','P004',2,45),('D004','O003','P006',1,30),('D005','O003','P007',1,45),('D006','O004','P003',5,12);
INSERT INTO INVENTORY_LOG VALUES('L001','P001','進貨',50,'2026-09-20'),('L002','P001','銷售',-2,'2026-10-01'),('L003','P008','盤點調整',-2,'2026-10-10');`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rows=(q,p=[])=>{const s=db.prepare(q);try{s.bind(p);let a=[];while(s.step())a.push(s.getAsObject());return a;}finally{s.free();}};
const id=(prefix,table,col)=>{const a=rows('SELECT '+col+' FROM '+table+' ORDER BY '+col+' DESC LIMIT 1');return prefix+String(a.length?parseInt(String(a[0][col]).slice(1),10)+1:1).padStart(3,'0');};
const money=n=>Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});
const table=(h,a)=>a.length?'<div class="scroll"><table><tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+a.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x??'')+'</td>').join('')+'</tr>').join('')+'</table></div>':'<p class="hint">目前沒有資料</p>';
function persist(){localStorage.setItem('stationeryDB',JSON.stringify(Array.from(db.export())));}
function refresh(){const ps=rows('SELECT p.ProductID,p.ProductName,c.CategoryName,p.Price,p.StockQuantity,p.MinStock FROM PRODUCTS p LEFT JOIN CATEGORIES c ON c.CategoryID=p.CategoryID ORDER BY p.ProductID');document.getElementById('products').innerHTML=table(['編號','商品','分類','價格','庫存','安全庫存'],ps.map(p=>[p.ProductID,p.ProductName,p.CategoryName,'$'+money(p.Price),p.StockQuantity,p.MinStock]));document.getElementById('product').innerHTML=ps.map(p=>'<option value="'+esc(p.ProductID)+'">'+esc(p.ProductName)+'（庫存 '+p.StockQuantity+'）</option>').join('');document.getElementById('member').innerHTML=rows('SELECT MemberID,Name FROM MEMBERS').map(m=>'<option value="'+esc(m.MemberID)+'">'+esc(m.Name)+'</option>').join('');const os=rows('SELECT o.OrderID,o.OrderDate,m.Name,o.TotalAmount FROM ORDERS o LEFT JOIN MEMBERS m ON m.MemberID=o.MemberID ORDER BY o.OrderDate DESC,o.OrderID DESC');document.getElementById('orders').innerHTML=os.length?'<div class="scroll"><table><tr><th>訂單編號</th><th>日期</th><th>會員</th><th>總額</th><th>明細</th><th>操作</th></tr>'+os.map(o=>'<tr><td>'+esc(o.OrderID)+'</td><td>'+esc(o.OrderDate)+'</td><td>'+esc(o.Name)+'</td><td>$'+money(o.TotalAmount)+'</td><td><button data-show="'+esc(o.OrderID)+'">查看</button></td><td><button class="danger" data-cancel="'+esc(o.OrderID)+'">取消</button></td></tr>').join('')+'</table></div>':'<p class="hint">目前沒有訂單</p>';renderCart();}
function renderCart(){document.getElementById('cart').innerHTML=table(['商品','單價','數量','小計'],cart.map(x=>[x.name,'$'+money(x.price),x.qty,'$'+money(x.price*x.qty)]));document.getElementById('total').textContent=money(cart.reduce((s,x)=>s+x.price*x.qty,0));}
document.getElementById('addp').onclick=()=>{const name=document.getElementById('pname').value.trim(),cat=document.getElementById('pcat').value,price=Number(document.getElementById('price').value),stock=Number(document.getElementById('stock').value),min=Number(document.getElementById('minstock').value);if(!name||price<=0||!Number.isFinite(price)||!Number.isInteger(stock)||stock<0||!Number.isInteger(min)||min<0){document.getElementById('pmsg').innerHTML='<span class="err">請確認商品名稱、價格及庫存格式。</span>';return;}const pid=id('P','PRODUCTS','ProductID');db.run('INSERT INTO PRODUCTS VALUES(?,?,?,?,?,?)',[pid,name,cat,price,stock,min]);if(stock)db.run('INSERT INTO INVENTORY_LOG VALUES(?,?,?,?,?)',[id('L','INVENTORY_LOG','LogID'),pid,'新增商品初始庫存',stock,new Date().toISOString().slice(0,10)]);persist();refresh();document.getElementById('pmsg').innerHTML='<span class="ok">新增成功：'+esc(pid)+'</span>';document.getElementById('pname').value='';document.getElementById('price').value='';};
document.getElementById('addline').onclick=()=>{const pid=document.getElementById('product').value,qty=Number(document.getElementById('qty').value),p=rows('SELECT * FROM PRODUCTS WHERE ProductID=?',[pid])[0];if(!p||!Number.isInteger(qty)||qty<1){document.getElementById('omsg').innerHTML='<span class="err">請輸入正確數量。</span>';return;}const old=cart.find(x=>x.pid===pid);if((old?old.qty:0)+qty>p.StockQuantity){document.getElementById('omsg').innerHTML='<span class="err">庫存不足。</span>';return;}if(old)old.qty+=qty;else cart.push({pid,name:p.ProductName,price:Number(p.Price),qty});renderCart();};
document.getElementById('checkout').onclick=()=>{if(!cart.length){document.getElementById('omsg').textContent='請先加入商品';return;}try{db.run('BEGIN');const oid=id('O','ORDERS','OrderID'),date=new Date().toISOString().slice(0,10),total=cart.reduce((s,x)=>s+x.price*x.qty,0);db.run('INSERT INTO ORDERS VALUES(?,?,?,?)',[oid,document.getElementById('member').value,date,total]);cart.forEach(x=>{const p=rows('SELECT StockQuantity FROM PRODUCTS WHERE ProductID=?',[x.pid])[0];if(!p||p.StockQuantity<x.qty)throw Error('庫存不足');db.run('INSERT INTO ORDER_DETAILS VALUES(?,?,?,?,?)',[id('D','ORDER_DETAILS','DetailID'),oid,x.pid,x.qty,x.price]);db.run('UPDATE PRODUCTS SET StockQuantity=StockQuantity-? WHERE ProductID=?',[x.qty,x.pid]);db.run('INSERT INTO INVENTORY_LOG VALUES(?,?,?,?,?)',[id('L','INVENTORY_LOG','LogID'),x.pid,'銷售',-x.qty,date]);});db.run('COMMIT');persist();cart=[];refresh();document.getElementById('omsg').innerHTML='<span class="ok">訂單 '+esc(oid)+' 已建立。</span>';}catch(e){try{db.run('ROLLBACK')}catch(_){}document.getElementById('omsg').innerHTML='<span class="err">'+esc(e.message)+'</span>';}}; 
document.getElementById('orders').onclick=e=>{const show=e.target.closest('[data-show]'),cancel=e.target.closest('[data-cancel]');if(show){const oid=show.dataset.show,d=rows('SELECT p.ProductName,x.Quantity,x.UnitPrice,x.Quantity*x.UnitPrice AS Subtotal FROM ORDER_DETAILS x JOIN PRODUCTS p ON p.ProductID=x.ProductID WHERE x.OrderID=?',[oid]);document.getElementById('detail').innerHTML='<h3>'+esc(oid)+' 訂單明細</h3>'+table(['商品','數量','單價','小計'],d.map(x=>[x.ProductName,x.Quantity,'$'+money(x.UnitPrice),'$'+money(x.Subtotal)]));}if(cancel&&confirm('確定取消訂單並回補庫存？')){const oid=cancel.dataset.cancel;try{db.run('BEGIN');const d=rows('SELECT ProductID,Quantity FROM ORDER_DETAILS WHERE OrderID=?',[oid]),date=new Date().toISOString().slice(0,10);d.forEach(x=>{db.run('UPDATE PRODUCTS SET StockQuantity=StockQuantity+? WHERE ProductID=?',[x.Quantity,x.ProductID]);db.run('INSERT INTO INVENTORY_LOG VALUES(?,?,?,?,?)',[id('L','INVENTORY_LOG','LogID'),x.ProductID,'取消訂單回補',x.Quantity,date]);});db.run('DELETE FROM ORDER_DETAILS WHERE OrderID=?',[oid]);db.run('DELETE FROM ORDERS WHERE OrderID=?',[oid]);db.run('COMMIT');persist();refresh();}catch(err){try{db.run('ROLLBACK')}catch(_){}alert(err.message);}}};
(async()=>{const SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'+f});const saved=localStorage.getItem('stationeryDB');if(saved){try{db=new SQL.Database(new Uint8Array(JSON.parse(saved)));}catch(e){localStorage.removeItem('stationeryDB');db=new SQL.Database();db.run(schema);}}else{db=new SQL.Database();db.run(schema);}refresh();})().catch(e=>alert('資料庫載入失敗：'+e.message));
</script></body></html>
